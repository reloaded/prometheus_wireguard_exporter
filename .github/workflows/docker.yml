name: Docker (ghcr.io publish)

# Forked from upstream `MindFlavor/prometheus_wireguard_exporter`'s
# `docker.yml`. Differences vs. upstream:
#   - Authenticates to GHCR via the auto-provided GITHUB_TOKEN
#     (no DOCKERHUB_PASSWORD secret needed).
#   - Publishes to ghcr.io/<owner>/<repo> instead of dockerhub.
#   - Tags via docker/metadata-action: branch tag for branch
#     pushes, semver tags for git tags, latest on default branch,
#     plus a sha-<short> tag on every push.
#   - Platform matrix preserved from upstream
#     (linux/amd64,linux/386,linux/arm64,linux/arm/v6,linux/arm/v7).

on:
  push:
    branches:
      - main
      - master
      - "wg-easy-*"
    tags:
      - "v*"
      - "*-wg-easy.*"
    paths:
      - .github/workflows/docker.yml
      - src/**
      - .dockerignore
      - Cargo.lock
      - Cargo.toml
      - Dockerfile
  pull_request:
    paths:
      - .github/workflows/docker.yml
      - src/**
      - .dockerignore
      - Cargo.lock
      - Cargo.toml
      - Dockerfile

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: docker build --target lint .

      - name: Build test image
        run: docker build --target test -t test-container .

      - name: Run tests in test container
        run: docker run --rm test-container

      - name: Build final image (single-arch verify)
        run: docker build .

  publish:
    needs: [verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Computes:
      #   - sha-<short> on every push
      #   - <branch> on branch pushes (e.g. wg-easy-support)
      #   - latest on default-branch (main/master) pushes
      #   - <semver> + <major>.<minor> on tag pushes (v1.2.3 OR
      #     3.6.6-wg-easy.1)
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=match,pattern=^(\d+\.\d+\.\d+-wg-easy\.\d+)$,group=1

      # Platform matrix: limited to amd64 + arm64 because the
      # `rust:1-alpine*` base image is only published for those
      # two architectures (plus ppc64le, which isn't useful here).
      # Restoring the full upstream `386 / arm/v6 / arm/v7` matrix
      # would require either:
      #   - bringing back the musl.cc cross-toolchain dance (which
      #     is unreliable — the service serves HTML errors that
      #     break tar-extraction), or
      #   - installing apt-packaged cross-toolchains
      #     (gcc-aarch64-linux-gnu etc.) on a Debian-based builder
      #     and emitting glibc-dynamic binaries (no static musl).
      # If the consumer cluster needs one of those archs, swap to
      # the Debian-cross approach.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.created }}
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
